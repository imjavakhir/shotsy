<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
<style>
  .body { animation: bob 3s ease-in-out infinite; transform-origin: 50px 50px; }
  .eye  { animation: blink 3s infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes bob { 0%,100% { transform: translateY(0) scale(1,1); } 50% { transform: translateY(-1.6px) scale(1.015,.985); } }
  @keyframes blink { 0%,57%,64%,100% { transform: scaleY(1); } 60% { transform: scaleY(.08); } }
  @media (prefers-reduced-motion: reduce) { .body, .eye { animation: none; } }
</style>
